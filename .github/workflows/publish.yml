name: Publish to npm

# Publishes when you push a version tag, e.g.:
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Switch to `npm ci` once package-lock.json is committed
      - run: npm install --no-audit --no-fund
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION"; exit 1
          fi
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          # Granular access token with "Bypass 2FA", scoped to @creptapay
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
